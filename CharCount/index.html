<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main">
      <h2 class="heading">Character Counter</h2>
      <textarea
        id="message"
        maxlength="100"
        placeholder="Start typing here..."
      ></textarea>
      <div class="counter"><span id="count">0</span>/100 characters</div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
